<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MealOps · Ventas</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-copy"><strong>MealOps</strong><span>Restaurant operations</span></div>
      </div>
      <nav class="nav">
        <a href="home.html">Panel</a>
        <a href="index.html" class="active">Ventas</a>
        <a href="kds.html" id="nav-kds">Cocina KDS</a>
        <a href="menu.html" id="nav-menu">Menú</a>
        <a href="products.html" id="nav-products">Productos</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user"><strong id="sidebar-name">Usuario</strong><span id="sidebar-role"></span></div>
        <button class="btn btn-ghost" onclick="logout()">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Ventas</h1>
          <p>Selecciona productos del menú de hoy y crea el pedido.</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="loadProducts(); loadOrders();">Actualizar</button>
        </div>
      </header>

      <div class="pos-layout">
        <section>
          <div class="toolbar">
            <input class="search" id="search" placeholder="Buscar producto..." oninput="renderProducts()">
          </div>
          <div id="products" class="products-grid"></div>

          <div class="spacer-24"></div>
          <h2 class="section-title">Mis pedidos recientes</h2>
          <div id="orders" class="list"></div>
        </section>

        <aside class="card cart-panel">
          <h2>Pedido actual</h2>
          <div class="cart-subtitle">Los precios se validan nuevamente en el servidor.</div>
          <div id="cart" class="cart-list"></div>
          <div class="total-row"><span>Total</span><strong id="total">$0.00</strong></div>
          <div class="field">
            <label for="type">Tipo de pedido</label>
            <select id="type">
              <option value="local">Local</option>
              <option value="llevar">Para llevar</option>
              <option value="domicilio">Domicilio</option>
            </select>
          </div>
          <div class="spacer-16"></div>
          <div class="cart-actions">
            <button class="btn btn-primary" id="create-order" onclick="createOrder()">Crear pedido</button>
            <button class="btn btn-secondary" onclick="clearCart()">Vaciar carrito</button>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
  <script>
    const currentUser = requireAuth();
    let products = [];
    let cart = {};
    let loading = false;

    if (currentUser) {
      document.getElementById('sidebar-name').textContent = currentUser.name || currentUser.phone || 'Usuario';
      document.getElementById('sidebar-role').textContent = currentUser.role || '';
      if (!['admin', 'cocina'].includes(currentUser.role)) document.getElementById('nav-kds').classList.add('hidden');
      if (currentUser.role !== 'admin') {
        document.getElementById('nav-menu').classList.add('hidden');
        document.getElementById('nav-products').classList.add('hidden');
      }
    }

    async function loadProducts() {
      try {
        products = await apiFetch('/products');
        renderProducts();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function renderProducts() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const filtered = products.filter((product) => product.name.toLowerCase().includes(query));
      const container = document.getElementById('products');

      if (!filtered.length) {
        container.innerHTML = '<div class="card card-pad muted">No hay productos disponibles en el menú de hoy.</div>';
        return;
      }

      container.innerHTML = filtered.map((product) => `
        <article class="card product-card">
          <h3>${escapeHtml(product.name)}</h3>
          <p>Disponible hoy</p>
          <div class="price">${formatCurrency(product.price)}</div>
          <button class="btn btn-secondary" onclick='addToCart(${JSON.stringify(Number(product.id))})'>Agregar</button>
        </article>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find((item) => Number(item.id) === Number(id));
      if (!product) return;
      if (!cart[id]) cart[id] = { id: Number(product.id), name: product.name, price: Number(product.price), quantity: 0 };
      cart[id].quantity += 1;
      renderCart();
      showToast(`${product.name} agregado`, 'success');
    }

    function decrease(id) {
      if (!cart[id]) return;
      cart[id].quantity -= 1;
      if (cart[id].quantity <= 0) delete cart[id];
      renderCart();
    }

    function increase(id) {
      if (!cart[id]) return;
      cart[id].quantity += 1;
      renderCart();
    }

    function clearCart() {
      cart = {};
      renderCart();
    }

    function renderCart() {
      const items = Object.values(cart);
      const container = document.getElementById('cart');
      const total = items.reduce((sum, item) => sum + item.price * item.quantity, 0);
      document.getElementById('total').textContent = formatCurrency(total);

      if (!items.length) {
        container.innerHTML = '<div class="cart-empty">Aún no agregas productos.</div>';
        return;
      }

      container.innerHTML = items.map((item) => `
        <div class="cart-item">
          <div>
            <strong>${escapeHtml(item.name)}</strong>
            <small>${formatCurrency(item.price)} × ${item.quantity}</small>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="decrease(${item.id})">−</button>
            <span>${item.quantity}</span>
            <button class="qty-btn" onclick="increase(${item.id})">+</button>
          </div>
        </div>
      `).join('');
    }

    async function createOrder() {
      if (loading) return;
      const items = Object.values(cart).map((item) => ({ product_id: item.id, quantity: item.quantity }));
      if (!items.length) return showToast('Agrega productos al carrito.', 'error');

      loading = true;
      const button = document.getElementById('create-order');
      button.disabled = true;

      try {
        await apiFetch('/orders', {
          method: 'POST',
          body: JSON.stringify({ items, type: document.getElementById('type').value })
        });
        clearCart();
        await loadOrders();
        showToast('Pedido creado correctamente.', 'success');
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        loading = false;
        button.disabled = false;
      }
    }

    async function loadOrders() {
      try {
        const data = await apiFetch('/orders');
        const container = document.getElementById('orders');
        if (!data.length) {
          container.innerHTML = '<div class="card card-pad muted">Todavía no tienes pedidos registrados.</div>';
          return;
        }

        container.innerHTML = data.slice(0, 8).map((order) => `
          <div class="list-row">
            <div class="list-main">
              <strong>Pedido #${order.id}</strong>
              <small>${escapeHtml(order.type || 'local')} · ${formatCurrency(order.total)}</small>
            </div>
            <span class="badge ${order.status === 'cancelado' ? 'badge-danger' : order.status === 'entregado' ? 'badge-success' : 'badge-warning'}">${escapeHtml(order.status)}</span>
          </div>
        `).join('');
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    renderCart();
    loadProducts();
    loadOrders();
  </script>
</body>
</html>
