<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú por día</title>
<link rel="stylesheet" href="../css/styles.css">
</head>

<body>
<header class="hero">

    <h1>MealOps</h1>
    <p>Configurar Menú</p>

    <div class="header-wave">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#FDBA74"
            d="M0,160L60,170C120,180,240,200,360,192C480,184,600,148,720,144C840,140,960,168,1080,170C1200,172,1320,148,1380,136L1440,128V0H0Z">
            </path>
        </svg>
    </div>

</header>
<div class="container">

<select id="daySelect">
  <option>Lunes</option>
  <option>Martes</option>
  <option>Miércoles</option>
  <option>Jueves</option>
  <option>Viernes</option>
  <option>Sábado</option>
  <option>Domingo</option>
</select>

<div id="products" style="margin-top:20px;"></div>

<br>

<button class="btn-primary" onclick="saveMenu()">Guardar este día</button>

</div>

<script>
function showToast(message, type = "info") {
    const container = document.getElementById("toast-container");

    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 3000);
}

const API = "http://localhost:3000";

const selected = new Set();

// 🔥 Mapear días
const dayMap = {
  "Lunes": "monday",
  "Martes": "tuesday",
  "Miércoles": "wednesday",
  "Jueves": "thursday",
  "Viernes": "friday",
  "Sábado": "saturday",
  "Domingo": "sunday"
};

// 🔥 CARGAR PRODUCTOS
async function loadProducts() {
  const res = await fetch(`${API}/products/all`);
  const data = await res.json();

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(p => {
    const div = document.createElement("div");
    div.className = "card product";

    div.innerHTML = `
      <div>
        <strong>${p.name}</strong><br>
        <span class="badge">$${p.price}</span>
      </div>

      <input type="checkbox" onchange="toggle(${p.id})">
    `;

    container.appendChild(div);
  });
}

// 🔁 TOGGLE
function toggle(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
}

// 💾 GUARDAR
async function saveMenu() {
  const select = document.getElementById("daySelect");
  const daySpanish = select.value;
  const day = dayMap[daySpanish];

  if (!day) {
    showToast("Día inválido", "error");
    return;
  }

  await fetch(`${API}/menu/day`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      day,
      products: Array.from(selected)
    })
  });

 showToast("Menú guardado", "success");
}

// INIT
loadProducts();
</script>
<div id="toast-container"></div>
</body>
</html>
