<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealOps — Inicio de Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div id="toast-container"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card-modern">
      <!-- LOGO -->
      <div class="auth-header-logo">
        <div class="brand-logo-badge" style="width: 48px; height: 48px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        <div>
          <div style="font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;">MealOps</div>
          <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Sistema Operativo Gastronómico</div>
        </div>
      </div>

      <h2 style="font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--text-main);">Acceso al Sistema</h2>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Teléfono o Correo Electrónico</label>
          <input type="text" id="phone" class="form-control" placeholder="0000000000 o admin@mealops.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" id="btn-submit">
          Ingresar al Panel
        </button>
      </form>

      <!-- ACCESOS DEMO RÁPIDOS -->
      <div class="demo-credentials-box">
        <div style="font-weight: 700; margin-bottom: 6px; color: var(--text-main);">⚡ Carga rápida de perfil demo:</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button class="btn btn-secondary btn-sm" onclick="fillDemo('0000000000', '123456')">Admin</button>
          <button class="btn btn-secondary btn-sm" onclick="fillDemo('1111111111', '123456')">Cocina</button>
          <button class="btn btn-secondary btn-sm" onclick="fillDemo('2222222222', '123456')">Cliente</button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
        ¿No tienes cuenta? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Crear cuenta de cliente</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API = (window.MEALOPS_CONFIG && window.MEALOPS_CONFIG.API_URL) || "http://localhost:3000";

    function showToast(msg, type = "info") {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function fillDemo(phone, pass) {
      document.getElementById("phone").value = phone;
      document.getElementById("password").value = pass;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const phoneOrEmail = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btn-submit");

      btn.disabled = true;
      btn.textContent = "Verificando credenciales...";

      try {
        const res = await fetch(`${API}/auth/login-phone`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phoneOrEmail, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.message || "Credenciales incorrectas", "error");
          btn.disabled = false;
          btn.textContent = "Ingresar al Panel";
          return;
        }

        // Guardar sesión
        localStorage.setItem("token", data.token);
        localStorage.setItem("role", data.role || (data.user && data.user.role) || "cliente");
        localStorage.setItem("userName", (data.user && data.user.name) || phoneOrEmail);

        showToast("✅ Inicio de sesión exitoso", "success");
        setTimeout(() => {
          window.location.href = "home.html";
        }, 600);

      } catch (err) {
        showToast("Error de conexión con el servidor", "error");
        btn.disabled = false;
        btn.textContent = "Ingresar al Panel";
      }
    }
  </script>
</body>
</html>
