<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MealOps · Acceso</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="auth-page">
    <section class="auth-aside">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-copy">
          <strong>MealOps</strong>
          <span>Restaurant operations</span>
        </div>
      </div>
      <h1>Tu operación diaria, en un solo lugar.</h1>
      <p>Ventas, cocina, menú y productos conectados para que el equipo trabaje con la misma información.</p>
    </section>

    <section class="auth-main">
      <div class="auth-card">
        <h2 id="auth-title">Iniciar sesión</h2>
        <p id="auth-copy">Accede con el teléfono registrado en MealOps.</p>

        <form class="auth-form" id="auth-form" novalidate>
          <div class="field hidden" id="name-field">
            <label for="name">Nombre</label>
            <input id="name" autocomplete="name" placeholder="Nombre completo">
          </div>

          <div class="field">
            <label for="phone">Teléfono</label>
            <input id="phone" inputmode="tel" autocomplete="tel" placeholder="4421234567">
          </div>

          <div class="field hidden" id="email-field">
            <label for="email">Correo opcional</label>
            <input id="email" type="email" autocomplete="email" placeholder="nombre@correo.com">
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>

          <button class="btn btn-primary" type="submit" id="submit-button">Entrar</button>
          <p id="error" class="form-error" role="alert"></p>
        </form>

        <div class="auth-switch">
          <span id="switch-copy">¿Aún no tienes una cuenta?</span>
          <button type="button" id="switch-button">Registrarme</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-container"></div>
  <script src="app.js"></script>
  <script>
    let mode = 'login';
    const form = document.getElementById('auth-form');
    const errorEl = document.getElementById('error');

    if (getToken()) {
      window.location.href = 'home.html';
    }

    document.getElementById('switch-button').addEventListener('click', () => {
      mode = mode === 'login' ? 'register' : 'login';
      const registering = mode === 'register';
      document.getElementById('name-field').classList.toggle('hidden', !registering);
      document.getElementById('email-field').classList.toggle('hidden', !registering);
      document.getElementById('auth-title').textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
      document.getElementById('auth-copy').textContent = registering
        ? 'Crea un acceso para comenzar a usar MealOps.'
        : 'Accede con el teléfono registrado en MealOps.';
      document.getElementById('submit-button').textContent = registering ? 'Crear cuenta' : 'Entrar';
      document.getElementById('switch-copy').textContent = registering ? '¿Ya tienes una cuenta?' : '¿Aún no tienes una cuenta?';
      document.getElementById('switch-button').textContent = registering ? 'Iniciar sesión' : 'Registrarme';
      errorEl.textContent = '';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!phone || !password) {
        errorEl.textContent = 'Completa teléfono y contraseña.';
        return;
      }

      const button = document.getElementById('submit-button');
      button.disabled = true;

      try {
        if (mode === 'register') {
          const name = document.getElementById('name').value.trim();
          const email = document.getElementById('email').value.trim();
          if (!name) throw new Error('El nombre es requerido.');

          await apiFetch('/auth/register-phone', {
            method: 'POST',
            body: JSON.stringify({ name, phone, password, email: email || null, allowPush: true })
          });

          showToast('Cuenta creada. Ahora inicia sesión.', 'success');
          document.getElementById('switch-button').click();
          return;
        }

        const data = await apiFetch('/auth/login-phone', {
          method: 'POST',
          body: JSON.stringify({ phone, password })
        });

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user || parseJwt(data.token) || {}));
        window.location.href = 'home.html';
      } catch (error) {
        errorEl.textContent = error.message || 'No fue posible iniciar sesión.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
