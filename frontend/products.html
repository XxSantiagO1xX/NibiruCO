<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MealOps · Productos</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">M</div><div class="brand-copy"><strong>MealOps</strong><span>Restaurant operations</span></div></div>
      <nav class="nav">
        <a href="home.html">Panel</a>
        <a href="index.html">Ventas</a>
        <a href="kds.html">Cocina KDS</a>
        <a href="menu.html">Menú</a>
        <a href="products.html" class="active">Productos</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost" onclick="logout()">Cerrar sesión</button></div>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Productos</h1>
          <p>Administra platillos, precios y disponibilidad.</p>
        </div>
      </header>

      <section class="card card-pad">
        <h2 class="section-title">Nuevo producto</h2>
        <div class="form-grid">
          <div class="field"><label for="name">Nombre</label><input id="name" placeholder="Ej. Hamburguesa clásica"></div>
          <div class="field"><label for="price">Precio</label><input id="price" type="number" min="0" step="0.01" placeholder="0.00"></div>
          <div class="field"><label for="image">URL de imagen opcional</label><input id="image" type="url" placeholder="https://..."></div>
        </div>
        <div class="spacer-16"></div>
        <button class="btn btn-primary" id="create-button" onclick="createProduct()">Agregar producto</button>
      </section>

      <div class="spacer-24"></div>
      <div class="page-header" style="margin-bottom:14px">
        <div><h2 class="section-title" style="margin:0">Catálogo</h2></div>
        <div class="header-actions"><input id="search" placeholder="Buscar..." oninput="renderProducts()" style="width:260px"></div>
      </div>
      <div id="list" class="list"></div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
  <script>
    requireAuth(['admin']);
    let products = [];

    async function loadProducts() {
      try {
        products = await apiFetch('/products/all');
        renderProducts();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function renderProducts() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const filtered = products.filter((product) => product.name.toLowerCase().includes(query));
      const list = document.getElementById('list');

      if (!filtered.length) {
        list.innerHTML = '<div class="card card-pad muted">No hay productos que coincidan con la búsqueda.</div>';
        return;
      }

      list.innerHTML = filtered.map((product) => `
        <div class="list-row">
          <div class="list-main">
            <strong>${escapeHtml(product.name)}</strong>
            <small>${formatCurrency(product.price)} · ID ${product.id}</small>
          </div>
          <div class="list-actions">
            <span class="badge ${product.available ? 'badge-success' : 'badge-danger'}">${product.available ? 'Disponible' : 'Agotado'}</span>
            <button class="btn btn-sm ${product.available ? 'btn-secondary' : 'btn-primary'}" onclick="toggleProduct(${product.id})">${product.available ? 'Marcar agotado' : 'Activar'}</button>
          </div>
        </div>
      `).join('');
    }

    async function createProduct() {
      const name = document.getElementById('name').value.trim();
      const price = Number(document.getElementById('price').value);
      const image = document.getElementById('image').value.trim();

      if (!name || !Number.isFinite(price) || price <= 0) {
        return showToast('Ingresa un nombre y un precio válido.', 'error');
      }

      const button = document.getElementById('create-button');
      button.disabled = true;
      try {
        await apiFetch('/products', {
          method: 'POST',
          body: JSON.stringify({ name, price, image: image || null })
        });
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('image').value = '';
        await loadProducts();
        showToast('Producto creado.', 'success');
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function toggleProduct(id) {
      try {
        await apiFetch(`/products/${id}`, { method: 'PATCH' });
        await loadProducts();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    loadProducts();
  </script>
</body>
</html>
