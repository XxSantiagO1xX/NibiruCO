<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MealOps · Centro de Expedición y Salida</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/theme.css" data-mealops-theme="true">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .counter-page { min-height: 100vh; padding: 24px 32px 64px; background: var(--bg); }
    .counter-shell { max-width: 1750px; margin: 0 auto; }
    
    /* Topbar */
    .counter-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
      padding: 14px 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .counter-title { display: flex; align-items: center; gap: 12px; }
    .counter-title-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--primary-soft); color: var(--primary);
      box-shadow: 0 2px 8px rgba(245, 102, 36, 0.15);
      flex-shrink: 0;
    }
    .counter-title h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.03em; color: var(--text); }
    .counter-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .counter-header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    /* Topbar Search */
    .counter-topbar-center {
      flex: 1;
      display: flex;
      align-items: center;
      margin: 0 16px;
      max-width: 600px;
    }
    .counter-topbar-search {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .counter-topbar-search .search-icon {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }
    .counter-topbar-search input {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 38px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: all 0.15s ease;
    }
    .counter-topbar-search input:focus {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* KPI Bar (Tarjetas como Filtros Interactivos Principales) */
    .counter-metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 960px) {
      .counter-metrics-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .counter-metrics-bar { grid-template-columns: 1fr; }
      .counter-header { flex-direction: column; align-items: stretch; }
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }
    .metric-card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft), var(--shadow-sm);
      background-color: #FFFBF8;
    }
    .metric-card.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 16px;
      right: 16px;
      height: 3px;
      background: var(--primary);
      border-radius: 3px 3px 0 0;
    }
    .metric-val { font-size: 28px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
    .metric-label { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }

    /* UNIFIED MOSTRADOR GRID (Vista Única) */
    .orders-unified-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
      width: 100%;
      align-items: stretch;
    }

    /* ORDER CARD WITH FOLIO RIBBON */
    .order-card-hub {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 16px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      min-width: 0;
    }
    .order-card-hub:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-focus);
    }
    .order-card-hub.ready {
      border-color: var(--role-mesero-border);
    }
    .order-card-hub.waiting-kitchen {
      border-color: var(--role-cocina-border);
    }
    .order-card-hub.delayed {
      border-color: var(--danger-border);
      background: #FFFDFC;
    }

    /* Dynamic Folio Ribbon */
    .card-folio-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 800;
      color: #FFFFFF !important;
      border-top-left-radius: 14px;
      border-bottom-right-radius: 12px;
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      letter-spacing: -0.02em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }
    .ribbon-salon, .ribbon-mesa, .ribbon-local, .ribbon-dine_in, .ribbon-dine-in, .ribbon-comer_aqui { background-color: #16A34A !important; color: #FFFFFF !important; }
    .ribbon-llevar, .ribbon-recoger, .ribbon-takeout, .ribbon-pickup, .ribbon-para_llevar, .ribbon-para-llevar { background-color: #F56624 !important; color: #FFFFFF !important; }
    .ribbon-domicilio, .ribbon-delivery, .ribbon-a_domicilio { background-color: #7C3AED !important; color: #FFFFFF !important; }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-width: 0;
    }
    .customer-line {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      word-break: break-word;
      overflow-wrap: break-word;
      line-height: 1.35;
    }
    .phone-line {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
      word-break: break-word;
    }

    .status-badge-hub {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-hub-prep { background: var(--role-cocina-soft); color: var(--role-cocina); border: 1px solid var(--role-cocina-border); }
    .badge-hub-ready { background: var(--role-mesero-soft); color: var(--role-mesero); border: 1px solid var(--role-mesero-border); }
    .badge-hub-transit { background: var(--role-repartidor-soft); color: var(--role-repartidor); border: 1px solid var(--role-repartidor-border); }
    .badge-hub-delivered { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .badge-hub-incident { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border); cursor: pointer; }

    .service-dest-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .dest-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .dest-mesa { background: var(--role-admin-soft); color: var(--role-admin); border: 1px solid var(--role-admin-border); }
    .dest-llevar { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning-border); }
    .dest-domicilio { background: var(--role-repartidor-soft); color: var(--role-repartidor); border: 1px solid var(--role-repartidor-border); }
    .dest-local { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

    .time-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .time-badge.alert {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger-border);
      font-weight: 800;
    }

    /* Items List & Highlighted Quantities */
    .items-container {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      gap: 6px;
    }
    .item-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--text);
    }
    .item-name-part {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      flex: 1;
    }
    .item-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tag-ready { background: var(--role-mesero-soft); color: var(--role-mesero); }
    .tag-kitchen { background: var(--role-cocina-soft); color: var(--role-cocina); }
    .item-qty-bold {
      font-weight: 800;
      color: var(--text);
      margin-right: 2px;
    }
    .item-name-text {
      font-weight: 500;
      color: var(--text);
    }
    .item-choices-text {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.35;
    }

    .address-box {
      background: var(--role-repartidor-soft);
      border: 1px solid var(--role-repartidor-border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      color: #5B21B6;
      line-height: 1.4;
    }
    .waiter-assigned-box {
      background: var(--role-admin-soft);
      border: 1px solid var(--role-admin-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: #0369A1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
      word-break: break-word;
    }

    /* Actions Grid & Soft Buttons */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-action-soft,
    .btn-soft-success,
    .btn-soft-primary,
    .btn-soft-info,
    .btn-soft-warning,
    .btn-soft-secondary {
      width: 100%;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      border: 1px solid transparent;
      box-sizing: border-box;
    }
    .btn-soft-success {
      background: rgba(22, 163, 74, 0.10);
      color: #15803D;
      border-color: rgba(22, 163, 74, 0.30);
    }
    .btn-soft-success:hover {
      background: rgba(22, 163, 74, 0.18);
      border-color: #16A34A;
      color: #14532D;
    }
    .btn-soft-primary {
      background: rgba(245, 102, 36, 0.10);
      color: #C2410C;
      border-color: rgba(245, 102, 36, 0.30);
    }
    .btn-soft-primary:hover {
      background: rgba(245, 102, 36, 0.18);
      border-color: #F56624;
      color: #9A3412;
    }
    .btn-soft-info {
      background: rgba(37, 99, 235, 0.10);
      color: #1D4ED8;
      border-color: rgba(37, 99, 235, 0.30);
    }
    .btn-soft-info:hover {
      background: rgba(37, 99, 235, 0.18);
      border-color: #2563EB;
      color: #1E40AF;
    }
    .btn-soft-warning {
      background: rgba(217, 119, 6, 0.10);
      color: #B45309;
      border-color: rgba(217, 119, 6, 0.30);
    }
    .btn-soft-warning:hover {
      background: rgba(217, 119, 6, 0.18);
      border-color: #D97706;
      color: #92400E;
    }
    .btn-soft-secondary {
      background: rgba(115, 111, 105, 0.08);
      color: #24211F;
      border-color: var(--border);
    }
    .btn-soft-secondary:hover {
      background: rgba(115, 111, 105, 0.15);
      border-color: var(--muted);
      color: #1E1B18;
    }

    /* INCIDENTS DRAWER */
    .incidents-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(36, 33, 31, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    .incidents-drawer-backdrop.hidden {
      display: none;
      opacity: 0;
    }
    .incidents-drawer {
      width: min(520px, 100%);
      height: 100%;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      animation: slideDrawer 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideDrawer {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .drawer-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-header h2 { margin: 0; font-size: 18px; font-weight: 800; color: var(--text); }
    .drawer-content {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .incident-item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .incident-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .incident-desc {
      font-size: 12px;
      color: var(--text);
      background: var(--surface-2);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      line-height: 1.4;
    }
    .incident-meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(36, 33, 31, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 120;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius-md);
      width: min(520px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    .empty-hub {
      padding: 48px 20px;
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--muted);
    }
    .empty-hub h3 { margin: 8px 0 3px; font-size: 15px; color: var(--text); font-weight: 800; }
    .empty-hub p { font-size: 12px; margin: 0; }
  </style>
</head>
<body>
  <main class="counter-page">
    <div class="counter-shell">
      <!-- Minimalist Clean Topbar Header with Integrated Search & Service Filters -->
      <header class="counter-header">
        <div class="counter-title">
          <div class="counter-title-icon">
            <svg class="ui-icon" width="22" height="22"><use href="assets/icons.svg#counter"></use></svg>
          </div>
          <div>
            <h1>Torre de Control</h1>
            <p>Centro de Expedición y Salida MealOps</p>
          </div>
        </div>

        <div class="counter-topbar-center">
          <div class="counter-topbar-search">
            <svg class="search-icon ui-icon"><use href="assets/icons.svg#search"></use></svg>
            <input type="text" id="counter-search-input" placeholder="Buscar folio, cliente, mesa o producto..." oninput="handleCounterSearch(this.value)">
          </div>
        </div>

        <div class="counter-header-actions">
          <button class="btn btn-secondary btn-sm" id="btn-open-incidents" onclick="toggleIncidentsDrawer()" style="position:relative">
            <svg class="ui-icon" width="15" height="15" style="color:var(--danger)"><use href="assets/icons.svg#alert"></use></svg>
            <span>Incidencias</span>
            <span class="badge badge-danger" id="header-incidents-badge" style="display:none;margin-left:4px;padding:2px 6px">0</span>
          </button>
          <span id="counter-sync" class="topbar-user-badge">
            <span class="ui-icon" style="width:7px;height:7px;border-radius:50%;background:var(--role-mesero);display:inline-block"></span> En Vivo
          </span>
          <button class="btn btn-secondary btn-sm" onclick="window.location.href='home.html'">Panel</button>
          <button class="btn btn-ghost btn-sm" onclick="logout()" title="Cerrar sesión">Salir</button>
        </div>
      </header>

      <!-- Tarjetas KPI como Filtros Interactivos Principales -->
      <section class="counter-metrics-bar">
        <div class="metric-card active" id="kpi-filter-all" onclick="setDestFilter('all')" title="Filtrar todos los pedidos activos">
          <div>
            <div class="metric-label">Todos los Pedidos</div>
            <div class="metric-val" id="count-all" style="color:var(--text)">0</div>
          </div>
          <svg class="ui-icon" style="color:var(--primary);width:26px;height:26px"><use href="assets/icons.svg#counter"></use></svg>
        </div>
        <div class="metric-card" id="kpi-filter-salon" onclick="setDestFilter('salon')" title="Filtrar pedidos de Salón / Mesa">
          <div>
            <div class="metric-label">Salón</div>
            <div class="metric-val" id="count-salon" style="color:var(--role-mesero)">0</div>
          </div>
          <svg class="ui-icon" style="color:var(--role-mesero);width:26px;height:26px"><use href="assets/icons.svg#dining"></use></svg>
        </div>
        <div class="metric-card" id="kpi-filter-llevar" onclick="setDestFilter('llevar')" title="Filtrar pedidos Para Llevar">
          <div>
            <div class="metric-label">Para Llevar</div>
            <div class="metric-val" id="count-llevar" style="color:var(--warning)">0</div>
          </div>
          <svg class="ui-icon" style="color:var(--warning);width:26px;height:26px"><use href="assets/icons.svg#bag"></use></svg>
        </div>
        <div class="metric-card" id="kpi-filter-domicilio" onclick="setDestFilter('domicilio')" title="Filtrar pedidos a Domicilio">
          <div>
            <div class="metric-label">Domicilio</div>
            <div class="metric-val" id="count-domicilio" style="color:var(--role-repartidor)">0</div>
          </div>
          <svg class="ui-icon" style="color:var(--role-repartidor);width:26px;height:26px"><use href="assets/icons.svg#bike"></use></svg>
        </div>
      </section>

      <!-- Main Display Layout (Cuadrícula Unificada) -->
      <section id="tower-main-area"></section>
    </div>
  </main>

  <!-- Side Drawer Incidencias -->
  <div id="incidents-drawer-backdrop" class="incidents-drawer-backdrop hidden" onclick="if(event.target===this) toggleIncidentsDrawer()">
    <aside class="incidents-drawer">
      <div class="drawer-header">
        <div style="display:flex;align-items:center;gap:10px">
          <svg class="ui-icon" width="20" height="20" style="color:var(--danger)"><use href="assets/icons.svg#alert"></use></svg>
          <h2>Bandeja de Incidencias</h2>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="toggleIncidentsDrawer()" title="Cerrar">
          <svg class="ui-icon" width="18" height="18"><use href="assets/icons.svg#close"></use></svg>
        </button>
      </div>
      <div class="drawer-content" id="incidents-drawer-list">
        <div class="empty-hub">
          <svg class="ui-icon" style="width:36px;height:36px;color:var(--role-mesero);margin:0 auto"><use href="assets/icons.svg#check"></use></svg>
          <h3>Sin incidencias activas</h3>
          <p>No hay reportes ni contratiempos pendientes de resolución.</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- Modal Resolver Incidencia -->
  <div id="resolve-incident-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0;font-size:18px;font-weight:800">Resolver Incidencia Operativa</h2>
        <button class="btn btn-ghost btn-sm" onclick="closeIncidentModal()"><svg class="ui-icon" width="16" height="16"><use href="assets/icons.svg#close"></use></svg></button>
      </div>
      <input type="hidden" id="incident-id-input">
      <div class="form-grid" style="grid-template-columns:1fr">
        <div class="field">
          <label for="incident-status-select">Estatus de Solución</label>
          <select id="incident-status-select">
            <option value="resuelta">Resuelta (Concluida)</option>
            <option value="en_revision">En Revisión / Seguimiento</option>
            <option value="cerrada">Descartada / Cerrada</option>
          </select>
        </div>
        <div class="field">
          <label for="incident-notes-input">Notas de Solución / Acción Tomada</label>
          <textarea id="incident-notes-input" rows="4" placeholder="Detalles de la solución acordada con cliente o repartidor..."></textarea>
        </div>
      </div>
      <div class="spacer-16"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button class="btn btn-secondary" onclick="closeIncidentModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitIncidentResolution()">Guardar Solución</button>
      </div>
    </div>
  </div>

  <audio id="alert-sound" src="alert.wav" preload="auto"></audio>
  <div id="toast-container"></div>
  <script src="app.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const currentUser = requireAuth(['mesero', 'cocina', 'repartidor', 'admin']);

    let orders = [];
    let incidents = [];
    let currentDestFilter = 'all'; // 'all' | 'salon' | 'llevar' | 'domicilio'
    let searchFilter = '';
    let refreshTimer;
    let knownReadyOrderIds = new Set();

    function handleCounterSearch(val) {
      searchFilter = String(val || '').trim().toLowerCase();
      render();
    }

    function matchesSearch(order) {
      if (!searchFilter) return true;
      const q = searchFilter;
      const folioStr = folioText(order).toLowerCase();
      const customer = String(order.customer_name || order.user_name || '').toLowerCase();
      const phone = String(order.user_phone || '').toLowerCase();
      const table = String(order.table_name || '').toLowerCase();
      const address = String(order.address || '').toLowerCase();
      const driver = String(order.driver_name || '').toLowerCase();
      const items = Array.isArray(order.items) ? order.items.map(i => String(i.name || '').toLowerCase()).join(' ') : '';
      return (
        String(order.id).includes(q) ||
        folioStr.includes(q) ||
        customer.includes(q) ||
        phone.includes(q) ||
        table.includes(q) ||
        address.includes(q) ||
        driver.includes(q) ||
        items.includes(q)
      );
    }

    const socket = io(API, {
      auth: { token: localStorage.getItem('token') },
      transports: ['websocket', 'polling']
    });
    socket.on('connect', () => {
      document.getElementById('counter-sync').innerHTML = '<span class="ui-icon" style="width:7px;height:7px;border-radius:50%;background:var(--role-mesero);display:inline-block"></span> En Vivo';
    });
    socket.on('disconnect', () => {
      document.getElementById('counter-sync').innerHTML = '<span class="ui-icon" style="width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block"></span> Reconectando…';
    });

    // Subscriptions
    socket.on('new-order', () => scheduleRefresh(true));
    socket.on('order-updated', () => scheduleRefresh(false));
    socket.on('orders-updated', () => scheduleRefresh(false));
    socket.on('counter-updated', () => scheduleRefresh(true));
    socket.on('tables-updated', () => scheduleRefresh(false));
    socket.on('trips-updated', () => scheduleRefresh(false));
    socket.on('delivery-updated', () => scheduleRefresh(false));
    socket.on('delivery-offer-created', () => scheduleRefresh(false));
    socket.on('delivery-offer-expired', () => scheduleRefresh(false));
    socket.on('delivery-offer-accepted', () => scheduleRefresh(false));
    socket.on('delivery-offer-rejected', () => scheduleRefresh(false));
    socket.on('driver-status-updated', () => scheduleRefresh(false));
    socket.on('shift-updated', () => scheduleRefresh(false));
    socket.on('incident-created', () => scheduleRefresh(true));
    socket.on('incident-updated', () => scheduleRefresh(false));
    socket.on('incident-resolved', () => scheduleRefresh(false));

    function scheduleRefresh(playSound = false) {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => loadAllData(playSound), 150);
    }

    function setDestFilter(dest) {
      currentDestFilter = dest;
      document.querySelectorAll('.counter-metrics-bar .metric-card').forEach(el => {
        el.classList.remove('active');
      });
      const activeCard = document.getElementById('kpi-filter-' + dest);
      if (activeCard) activeCard.classList.add('active');
      render();
    }

    function toggleIncidentsDrawer(open = null) {
      const drawer = document.getElementById('incidents-drawer-backdrop');
      const shouldOpen = open !== null ? open : drawer.classList.contains('hidden');
      if (shouldOpen) {
        drawer.classList.remove('hidden');
        renderIncidentsDrawer();
      } else {
        drawer.classList.add('hidden');
      }
    }

    function folioText(order) {
      return order.folio ? ('F' + String(order.folio).padStart(3, '0')) : ('#' + order.id);
    }

    function serviceBadgeSvg(order) {
      const type = (order.service_type || order.serviceType || order.type || 'local').toLowerCase();
      if (type === 'mesa') {
        return '<span class="dest-pill dest-mesa"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#dining"></use></svg>' + escapeHtml(order.table_name || order.type || 'Mesa') + '</span>';
      }
      if (type === 'local' || type === 'salon' || type === 'dine_in' || type === 'comer_aqui') {
        if (!order.table_session_id && !order.table_id && !order.table_name) {
          return '<span class="dest-pill dest-local"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#counter"></use></svg> Comer aquí</span>';
        }
        return '<span class="dest-pill dest-mesa"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#dining"></use></svg>' + escapeHtml(order.table_name || 'Salón') + '</span>';
      }
      if (type === 'llevar' || type === 'takeout' || type === 'para_llevar') return '<span class="dest-pill dest-llevar"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#bag"></use></svg> Para Llevar</span>';
      if (type === 'recoger' || type === 'pickup') return '<span class="dest-pill dest-llevar"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#box"></use></svg> Recoger</span>';
      if (type === 'domicilio' || type === 'delivery' || type === 'a_domicilio') return '<span class="dest-pill dest-domicilio"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#bike"></use></svg> A Domicilio</span>';
      return '<span class="dest-pill dest-local">' + escapeHtml(type) + '</span>';
    }

    function matchesDestFilter(order) {
      if (currentDestFilter === 'all') return true;
      const type = (order.service_type || order.serviceType || order.type || 'local').toLowerCase();
      const hasTable = Boolean(order.table_session_id || order.table_id || order.table_name);
      if (currentDestFilter === 'salon') return type === 'mesa' || type === 'local' || type === 'salon' || type === 'dine_in' || type === 'comer_aqui' || hasTable;
      if (currentDestFilter === 'llevar') return type === 'llevar' || type === 'recoger' || type === 'takeout' || type === 'pickup' || type === 'para_llevar' || type === 'para-llevar';
      if (currentDestFilter === 'domicilio') return type === 'domicilio' || type === 'delivery' || type === 'a_domicilio';
      return true;
    }

    function renderOrderCard(order) {
      const isDelivered = order.status === 'entregado';
      const summary = order.summary || {};
      const stage = summary.counter_stage || 'esperando_cocina';
      const isDelayed = summary.is_delayed;
      const serviceType = String(order.service_type || order.serviceType || order.type || 'local').toLowerCase();
      const hasTable = Boolean(order.table_session_id || order.table_id || order.table_name);

      // Dynamic Ribbon class based on service type:
      // - Salón / Comer aquí: #16A34A (ribbon-salon)
      // - Para Llevar / Recoger: #F56624 (ribbon-llevar)
      // - Domicilio / Delivery: #7C3AED (ribbon-domicilio)
      let ribbonClass = 'ribbon-salon';
      if (serviceType === 'domicilio' || serviceType === 'delivery' || serviceType === 'a_domicilio') {
        ribbonClass = 'ribbon-domicilio';
      } else if (serviceType === 'llevar' || serviceType === 'recoger' || serviceType === 'takeout' || serviceType === 'pickup' || serviceType === 'para_llevar' || serviceType === 'para-llevar') {
        ribbonClass = 'ribbon-llevar';
      } else if (serviceType === 'mesa' || serviceType === 'salon' || serviceType === 'dine_in' || serviceType === 'local' || serviceType === 'comer_aqui' || serviceType === 'dine-in' || hasTable) {
        ribbonClass = 'ribbon-salon';
      }

      const ribbonHtml = '<div class="card-folio-ribbon ' + ribbonClass + '">' + folioText(order) + '</div>';

      // Check open incidents
      const orderIncidents = incidents.filter(i => Number(i.order_id) === Number(order.id) && i.status !== 'resuelta' && i.status !== 'cerrada');
      const hasOpenIncident = orderIncidents.length > 0;

      let statusBadgeHtml = '';
      if (hasOpenIncident) {
        statusBadgeHtml = '<span class="status-badge-hub badge-hub-incident" onclick="toggleIncidentsDrawer(true)" title="Ver incidencia activa"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#alert"></use></svg> Incidencia</span>';
      } else if (isDelivered) {
        statusBadgeHtml = '<span class="status-badge-hub badge-hub-delivered"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#check"></use></svg> Entregado</span>';
      } else if (serviceType === 'domicilio' || serviceType === 'delivery' || serviceType === 'a_domicilio') {
        const tripBadge = order.trip_folio ? (' · Viaje #' + order.trip_folio) : '';
        if (stage === 'en_ruta') {
          statusBadgeHtml = '<span class="status-badge-hub badge-hub-transit"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#bike"></use></svg> En ruta' + tripBadge + '</span>';
        } else if (order.driver_name) {
          statusBadgeHtml = '<span class="status-badge-hub badge-hub-ready"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#bike"></use></svg> ' + escapeHtml(order.driver_name) + tripBadge + '</span>';
        } else if (stage === 'oferta_enviada' && summary.active_offer) {
          statusBadgeHtml = '<span class="status-badge-hub badge-hub-prep" style="background:var(--warning-soft);color:var(--warning);border-color:var(--warning-border)">Oferta (' + summary.active_offer.seconds_left + 's)</span>';
        } else {
          statusBadgeHtml = '<span class="status-badge-hub badge-hub-prep" style="background:var(--role-repartidor-soft);color:var(--role-repartidor)">Por despachar</span>';
        }
      } else if (serviceType === 'mesa' || order.table_session_id || order.table_name) {
        statusBadgeHtml = '<span class="status-badge-hub badge-hub-ready"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#dining"></use></svg> Salón</span>';
      } else if (serviceType === 'llevar' || serviceType === 'recoger' || serviceType === 'takeout' || serviceType === 'pickup' || serviceType === 'para_llevar' || serviceType === 'para-llevar') {
        statusBadgeHtml = '<span class="status-badge-hub badge-hub-ready"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#bag"></use></svg> Para Llevar</span>';
      } else {
        statusBadgeHtml = '<span class="status-badge-hub badge-hub-ready"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#check"></use></svg> Activo</span>';
      }

      // Items list with highlighted bold quantities
      const items = Array.isArray(order.items) ? order.items : [];
      const itemsHtml = items.map(item => {
        const choices = Array.isArray(item.choices) ? item.choices : [];
        const choicesHtml = choices.length
          ? '<div class="item-choices-text">• ' + choices.map(c => escapeHtml(c.name)).join(' · ') + '</div>'
          : '';

        return '<div class="item-line">' +
          '<div class="item-name-part">' +
            '<div style="min-width:0">' +
              '<strong class="item-qty-bold">' + item.quantity + '×</strong> ' +
              '<span class="item-name-text">' + escapeHtml(item.name || ('Producto #' + item.product_id)) + '</span>' +
              choicesHtml +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      // Metadata blocks
      let metaBlockHtml = '';
      if (serviceType === 'mesa' || order.table_session_id || order.table_name) {
        metaBlockHtml += '<div class="waiter-assigned-box">' +
          '<span><strong>Mesa:</strong> ' + escapeHtml(order.table_name || 'Salón') + '</span>' +
          '<span><strong>Mesero:</strong> ' + escapeHtml(order.waiter_display_name || 'Sin asignar') + '</span>' +
        '</div>';
      }

      if (serviceType === 'domicilio' || serviceType === 'delivery' || serviceType === 'a_domicilio') {
        let driverInfo = '';
        const tripLabel = order.trip_folio ? (' · <strong>Viaje #' + order.trip_folio + '</strong>') : '';
        if (isDelivered) {
          driverInfo = order.driver_name
            ? ('<svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#bike"></use></svg> <strong>Entregado por:</strong> ' + escapeHtml(order.driver_name) + tripLabel)
            : ('<strong>Entrega finalizada</strong>' + tripLabel);
        } else if (stage === 'en_ruta') {
          driverInfo = '<svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#bike"></use></svg> <strong>En ruta con:</strong> ' + escapeHtml(order.driver_name || 'Repartidor') + tripLabel + (order.delivery_pin ? (' · <strong>PIN:</strong> ' + order.delivery_pin) : '');
        } else if (order.driver_name) {
          driverInfo = '<svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#bike"></use></svg> <strong>Asignado:</strong> ' + escapeHtml(order.driver_name) + tripLabel + (order.delivery_pin ? (' · <strong>PIN:</strong> ' + order.delivery_pin) : '');
        } else if (stage === 'oferta_enviada' && summary.active_offer) {
          driverInfo = '<strong>Oferta enviada:</strong> ' + escapeHtml(summary.active_offer.driver_name) + ' (' + summary.active_offer.seconds_left + 's)';
        } else {
          driverInfo = '<strong>Despacho:</strong> Buscando repartidor disponible';
        }

        metaBlockHtml += '<div class="address-box">' +
          '<div><svg class="ui-icon" width="13" height="13" style="vertical-align:-2px"><use href="assets/icons.svg#map-pin"></use></svg> <strong>' + escapeHtml(order.address || 'Dirección de entrega') + '</strong></div>' +
          '<div style="margin-top:4px;font-size:11px">' + driverInfo + '</div>' +
        '</div>';
      }

      // Direct Resolutive Action Buttons
      let actionsHtml = '';
      if (!isDelivered) {
        if (serviceType === 'domicilio' || serviceType === 'delivery' || serviceType === 'a_domicilio') {
          if (order.driver_name || stage === 'en_ruta' || stage === 'esperando_recogida') {
            actionsHtml += '<button class="btn-soft-success" onclick="deliverOrder(' + order.id + ')"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#check"></use></svg> Marcar Entregado</button>';
          } else {
            actionsHtml += '<button class="btn-soft-primary" onclick="openAssignDriverModal(' + order.id + ')"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#bike"></use></svg> Despachar Repartidor</button>';
          }
        } else if (serviceType === 'mesa' || order.table_session_id || order.table_name) {
          actionsHtml += '<button class="btn-soft-success" onclick="deliverTable(' + order.id + ')"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#check"></use></svg> Servido en Mesa</button>';
        } else if (serviceType === 'llevar' || serviceType === 'recoger' || serviceType === 'takeout' || serviceType === 'pickup' || serviceType === 'para_llevar' || serviceType === 'para-llevar') {
          actionsHtml += '<button class="btn-soft-success" onclick="deliverOrder(' + order.id + ')"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#check"></use></svg> Completar / Entregar</button>';
        } else {
          // local sin mesa
          actionsHtml += '<button class="btn-soft-secondary" onclick="window.location.href=\'tables.html\'">Asignar a Mesa</button>' +
            '<button class="btn-soft-success" onclick="deliverOrder(' + order.id + ')"><svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#check"></use></svg> Completar / Cobrar</button>';
        }
      }

      const cardClass = isDelivered ? 'delivered' : isDelayed ? 'delayed' : '';

      return '<article class="order-card-hub ' + cardClass + '" id="hub-order-' + order.id + '">' +
        ribbonHtml +
        '<div class="card-header-row">' +
          '<div style="min-width:0;flex:1">' +
            '<div class="customer-line">' + escapeHtml(order.customer_name || order.user_name || 'Cliente') + '</div>' +
            (order.user_phone ? ('<div class="phone-line"><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#phone"></use></svg> ' + escapeHtml(order.user_phone) + '</div>') : '') +
          '</div>' +
          '<div style="flex-shrink:0;text-align:right">' + statusBadgeHtml + '</div>' +
        '</div>' +
        '<div class="service-dest-row">' +
          serviceBadgeSvg(order) +
          '<span class="time-badge ' + (isDelayed ? 'alert' : '') + '">' +
            '<svg class="ui-icon" width="11" height="11"><use href="assets/icons.svg#clock"></use></svg> ' + (summary.elapsed_minutes || 0) + ' min ' + (isDelayed ? '· DEMORADO' : '') +
          '</span>' +
          '<span class="time-badge" style="font-weight:700">' +
            (order.payment_status === 'paid' ? 'Pagado' : 'Pago pendiente') + ' · ' + formatCurrency(order.total) +
          '</span>' +
        '</div>' +
        metaBlockHtml +
        '<div class="items-container">' +
          (itemsHtml || '<div class="muted">Sin detalle de platillos.</div>') +
        '</div>' +
        (actionsHtml ? ('<div class="actions-grid">' + actionsHtml + '</div>') : '') +
      '</article>';
    }

    function renderIncidentsDrawer() {
      const list = document.getElementById('incidents-drawer-list');
      if (!incidents.length) {
        list.innerHTML = '<div class="empty-hub">' +
          '<svg class="ui-icon" style="width:36px;height:36px;color:var(--role-mesero);margin:0 auto"><use href="assets/icons.svg#check"></use></svg>' +
          '<h3>Sin incidencias registradas</h3>' +
          '<p>No hay reportes ni contratiempos reportados hoy.</p>' +
        '</div>';
        return;
      }

      list.innerHTML = incidents.map(inc => {
        const isResolved = inc.status === 'resuelta' || inc.status === 'cerrada';
        const statusClass = inc.status === 'nueva' ? 'badge-danger' : inc.status === 'en_revision' ? 'badge-warning' : 'badge-success';
        const statusLabel = inc.status === 'nueva' ? 'Nueva Incidencia' : inc.status === 'en_revision' ? 'En Revisión' : 'Resuelta';

        return '<article class="incident-item-card" id="incident-' + inc.id + '">' +
          '<div class="incident-top">' +
            '<div>' +
              '<span class="badge ' + statusClass + '">' + statusLabel + '</span>' +
              '<div class="folio-box" style="font-size:18px;margin-top:6px">Pedido F' + String(inc.order_folio || inc.order_id).padStart(3, '0') + '</div>' +
              '<div class="customer-line">' + escapeHtml(inc.customer_name || 'Cliente') + '</div>' +
            '</div>' +
            '<div style="text-align:right">' +
              '<span class="dest-pill dest-domicilio">' + escapeHtml(inc.category || 'Incidencia') + '</span>' +
              '<div style="font-size:10.5px;color:var(--muted);margin-top:4px">Prioridad: <strong>' + (inc.priority ? inc.priority.toUpperCase() : 'MEDIA') + '</strong></div>' +
            '</div>' +
          '</div>' +
          '<div class="incident-desc">' +
            '<strong>Reporte del Repartidor:</strong><br>' +
            escapeHtml(inc.description || 'Sin notas adicionales') +
          '</div>' +
          (inc.admin_notes ? (
            '<div style="font-size:11.5px;background:var(--role-mesero-soft);border:1px solid var(--role-mesero-border);padding:7px 10px;border-radius:8px;color:#065F46">' +
              '<strong>Solución:</strong> ' + escapeHtml(inc.admin_notes) +
            '</div>'
          ) : '') +
          '<div class="incident-meta-row">' +
            '<span><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#bike"></use></svg> ' + escapeHtml(inc.driver_name || 'Repartidor') + ' (' + (inc.driver_short_code || 'REP') + ')</span>' +
            '<span><svg class="ui-icon" width="12" height="12"><use href="assets/icons.svg#map-pin"></use></svg> ' + escapeHtml(inc.delivery_address || 'Dirección') + '</span>' +
          '</div>' +
          '<div class="actions-grid">' +
            '<button class="btn-soft-secondary" onclick="focusOrderFromIncident(' + inc.order_id + ')">' +
              '<svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#search"></use></svg> Ver Pedido F' + String(inc.order_folio || inc.order_id).padStart(3, '0') +
            '</button>' +
            (!isResolved ? (
              '<button class="btn-soft-success" onclick="openResolveModal(' + inc.id + ')">' +
                '<svg class="ui-icon" width="13" height="13"><use href="assets/icons.svg#check"></use></svg> Resolver Incidencia' +
              '</button>'
            ) : '') +
          '</div>' +
        '</article>';
      }).join('');
    }

    function focusOrderFromIncident(orderId) {
      toggleIncidentsDrawer(false);
      setTimeout(() => {
        const el = document.getElementById('hub-order-' + orderId);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.style.outline = '3px solid var(--primary)';
          setTimeout(() => el.style.outline = '', 3000);
        } else {
          showToast('El pedido #' + orderId + ' no está visible en la vista actual.', 'info');
        }
      }, 250);
    }

    function render() {
      const nonCancelled = orders.filter(o => o.status !== 'cancelado');
      const activeOrders = nonCancelled.filter(o => o.status !== 'entregado');

      function getCategory(o) {
        const type = String(o.service_type || o.serviceType || o.type || 'local').toLowerCase();
        if (type === 'domicilio' || type === 'delivery' || type === 'a_domicilio') return 'domicilio';
        if (type === 'llevar' || type === 'recoger' || type === 'takeout' || type === 'pickup' || type === 'para_llevar' || type === 'para-llevar') return 'llevar';
        return 'salon';
      }

      const salonOrders = activeOrders.filter(o => getCategory(o) === 'salon');
      const llevarOrders = activeOrders.filter(o => getCategory(o) === 'llevar');
      const domicilioOrders = activeOrders.filter(o => getCategory(o) === 'domicilio');

      // Update KPI counters
      const elAll = document.getElementById('count-all');
      const elSalon = document.getElementById('count-salon');
      const elLlevar = document.getElementById('count-llevar');
      const elDomicilio = document.getElementById('count-domicilio');

      if (elAll) elAll.textContent = activeOrders.length;
      if (elSalon) elSalon.textContent = salonOrders.length;
      if (elLlevar) elLlevar.textContent = llevarOrders.length;
      if (elDomicilio) elDomicilio.textContent = domicilioOrders.length;

      // Filter active orders based on selected KPI tab & search query
      const filteredOrders = activeOrders
        .filter(matchesDestFilter)
        .filter(matchesSearch);

      // Open incidents
      const openIncidents = incidents.filter(i => i.status !== 'resuelta' && i.status !== 'cerrada');
      const headerBadge = document.getElementById('header-incidents-badge');
      if (headerBadge) {
        if (openIncidents.length > 0) {
          headerBadge.style.display = 'inline-flex';
          headerBadge.textContent = openIncidents.length;
        } else {
          headerBadge.style.display = 'none';
        }
      }

      const mainArea = document.getElementById('tower-main-area');
      if (!mainArea) return;

      if (!filteredOrders.length) {
        let emptyMsg = 'No hay pedidos activos en este momento.';
        if (searchFilter) {
          emptyMsg = `No se encontraron pedidos que coincidan con "${escapeHtml(searchFilter)}".`;
        } else if (currentDestFilter === 'salon') {
          emptyMsg = 'No hay comandas activas en Salón.';
        } else if (currentDestFilter === 'llevar') {
          emptyMsg = 'No hay pedidos activos Para Llevar.';
        } else if (currentDestFilter === 'domicilio') {
          emptyMsg = 'No hay entregas a Domicilio activas.';
        }

        mainArea.innerHTML = `
          <div class="empty-hub">
            <svg class="ui-icon" style="width:40px;height:40px;color:var(--muted);margin:0 auto"><use href="assets/icons.svg#check"></use></svg>
            <h3>Sin pedidos activos</h3>
            <p>${emptyMsg}</p>
          </div>
        `;
        return;
      }

      // Render unified grid directly
      mainArea.innerHTML = `
        <div class="orders-unified-grid">
          ${filteredOrders.map(renderOrderCard).join('')}
        </div>
      `;
    }

    async function loadAllData(playSoundIfNewReady = false) {
      try {
        const [ordersData, incidentsData] = await Promise.all([
          apiFetch('/counter/orders'),
          apiFetch('/deliveries/incidents').catch(() => ({ incidents: [] }))
        ]);

        orders = ordersData || [];
        incidents = incidentsData?.incidents || (Array.isArray(incidentsData) ? incidentsData : []);

        if (playSoundIfNewReady) {
          const currentReadyIds = new Set(orders.filter(o => o.status === 'listo').map(o => o.id));
          let hasNewReady = false;
          currentReadyIds.forEach(id => {
            if (!knownReadyOrderIds.has(id)) hasNewReady = true;
          });
          if (hasNewReady) {
            try { document.getElementById('alert-sound').play(); } catch (_) {}
          }
          knownReadyOrderIds = currentReadyIds;
        }

        render();
        if (!document.getElementById('incidents-drawer-backdrop').classList.contains('hidden')) {
          renderIncidentsDrawer();
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Operational Actions
    async function markReady(orderId) {
      try {
        await apiFetch('/counter/orders/' + orderId + '/mark-ready', { method: 'PATCH' });
        showToast('Pedido marcado como listo en mostrador.', 'success');
        await loadAllData(false);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function pickupWaiter(orderId) {
      try {
        await apiFetch('/counter/orders/' + orderId + '/pickup-waiter', { method: 'PATCH' });
        showToast('Recogida de mesero registrada.', 'success');
        await loadAllData(false);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deliverTable(orderId) {
      try {
        await apiFetch('/counter/orders/' + orderId + '/deliver-table', { method: 'PATCH' });
        showToast('Pedido servido en mesa.', 'success');
        await loadAllData(false);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deliverOrder(orderId) {
      try {
        await apiFetch('/counter/orders/' + orderId + '/deliver', { method: 'PATCH' });
        showToast('Pedido entregado al cliente.', 'success');
        await loadAllData(false);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function notifyWaiter(orderId) {
      try {
        const res = await apiFetch('/counter/orders/' + orderId + '/notify-waiter', { method: 'POST' });
        showToast(res.message || 'Mesero notificado.', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function openAssignDriverModal(orderId) {
      try {
        const drivers = await apiFetch('/deliveries/drivers');
        if (!drivers.length) {
          showToast('No hay repartidores registrados.', 'error');
          return;
        }
        const options = drivers.map(d => d.id + ': ' + d.name + ' [' + (d.driver_status || 'offline') + (d.active_trip_id ? ' · en viaje' : '') + ']').join('\n');
        const chosen = prompt('Asignar repartidor manual (Admin Override) para Pedido #' + orderId + ':\nIngresa el ID del repartidor:\n\n' + options);
        if (!chosen) return;
        const driverId = Number(chosen.trim());
        if (!driverId) return showToast('ID de repartidor inválido', 'error');

        await apiFetch('/deliveries/trips/override', {
          method: 'POST',
          body: JSON.stringify({ driver_user_id: driverId, order_ids: [orderId] })
        });
        showToast('Repartidor asignado correctamente.', 'success');
        await loadAllData(false);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function openResolveModal(incidentId) {
      document.getElementById('incident-id-input').value = incidentId;
      document.getElementById('incident-status-select').value = 'resuelta';
      document.getElementById('incident-notes-input').value = '';
      document.getElementById('resolve-incident-modal').classList.remove('hidden');
    }

    function closeIncidentModal() {
      document.getElementById('resolve-incident-modal').classList.add('hidden');
    }

    async function submitIncidentResolution() {
      const incidentId = document.getElementById('incident-id-input').value;
      const status = document.getElementById('incident-status-select').value;
      const admin_notes = document.getElementById('incident-notes-input').value.trim();

      try {
        await apiFetch('/deliveries/incidents/' + incidentId, {
          method: 'PATCH',
          body: JSON.stringify({ status, admin_notes })
        });
        closeIncidentModal();
        showToast('Incidencia resuelta correctamente.', 'success');
        await loadAllData(false);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    loadAllData(false);
    setInterval(() => loadAllData(false), 8000);
  </script>
</body>
</html>
