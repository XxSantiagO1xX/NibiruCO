<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MealOps · Cocina KDS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="kds-page">
    <header class="kds-header">
      <div>
        <h1>MealOps KDS</h1>
        <p>Cocina · pedidos en tiempo real</p>
      </div>
      <div class="header-actions">
        <span id="kds-stats" class="kds-stats">Conectando...</span>
        <button class="btn btn-secondary" onclick="window.location.href='home.html'">Panel</button>
        <button class="btn btn-secondary" onclick="logout()">Salir</button>
      </div>
    </header>

    <section id="board" class="kds-board"></section>
  </main>

  <div id="toast-container"></div>
  <script src="app.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    requireAuth(['cocina', 'admin']);

    let orders = [];
    let refreshTimer;

    const nextStatus = {
      pendiente: 'aceptado',
      aceptado: 'preparando',
      preparando: 'listo',
      listo: 'entregado'
    };

    const actionLabel = {
      pendiente: 'Aceptar pedido',
      aceptado: 'Comenzar preparación',
      preparando: 'Marcar como listo',
      listo: 'Entregar'
    };

    const serviceLabels = {
      mesa: 'Mesa',
      local: 'Local',
      llevar: 'Para llevar',
      recoger: 'Recoger',
      domicilio: 'Domicilio'
    };

    const socket = io(API, { transports: ['websocket', 'polling'] });
    socket.on('connect', () => {
      document.getElementById('kds-stats').textContent = '● Sincronizado';
    });
    socket.on('disconnect', () => {
      document.getElementById('kds-stats').textContent = 'Reconectando...';
    });
    socket.on('new-order', scheduleRefresh);
    socket.on('order-updated', scheduleRefresh);
    socket.on('orders-updated', scheduleRefresh);

    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadOrders, 180);
    }

    async function loadOrders() {
      try {
        orders = await apiFetch('/orders/admin/all');
        renderOrders();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function ageInMinutes(createdAt) {
      if (!createdAt) return 0;
      const timestamp = new Date(createdAt).getTime();
      return Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
    }

    function formatPickup(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    }

    function orderLabel(order) {
      if (order.service_type === 'mesa') return order.type || 'Mesa';
      const service = serviceLabels[order.service_type] || order.type || 'Pedido';
      const folio = order.folio ? ` · F${String(order.folio).padStart(3, '0')}` : '';
      return `${service}${folio}`;
    }

    function renderOrders() {
      const active = orders.filter((order) => !['entregado', 'cancelado'].includes(order.status));
      document.getElementById('kds-stats').textContent = `${socket.connected ? '● ' : ''}${active.length} pedidos activos`;

      const board = document.getElementById('board');
      if (!active.length) {
        board.innerHTML = '<div class="order-card"><strong>Sin pedidos activos</strong><div class="order-meta">La cocina está al día.</div></div>';
        return;
      }

      board.innerHTML = active.map((order) => {
        const age = ageInMinutes(order.created_at);
        const cssState = age >= 15 ? 'urgent' : order.status === 'preparando' ? 'preparing' : order.status === 'listo' ? 'ready' : 'pending';
        const items = Array.isArray(order.items) ? order.items : [];
        const pickup = formatPickup(order.pickup_at);
        return `
          <article class="order-card ${cssState}">
            <div class="order-head">
              <div>
                <strong>${escapeHtml(orderLabel(order))}</strong>
                <div class="order-meta">${escapeHtml(order.customer_name || order.name || order.phone || 'Cliente')}${pickup ? ` · ${escapeHtml(pickup)}` : ''}</div>
              </div>
              <div class="order-meta">${age} min</div>
            </div>

            <div class="order-items">
              ${items.map((item) => `
                <div class="order-item" style="align-items:flex-start">
                  <span>
                    ${escapeHtml(item.name || `Producto ${item.product_id}`)}
                    ${(Array.isArray(item.choices) && item.choices.length) ? `<small style="display:block;margin-top:4px;color:var(--muted)">${item.choices.map((choice) => escapeHtml(choice.name)).join(' · ')}</small>` : ''}
                  </span>
                  <strong>×${Number(item.quantity) || 1}</strong>
                </div>
              `).join('') || '<div class="order-meta">Sin detalle de productos</div>'}
            </div>

            <div class="order-meta">Estado: ${escapeHtml(order.status)}</div>
            <div class="order-actions">
              ${nextStatus[order.status] ? `<button class="btn ${order.status === 'listo' ? 'btn-success' : 'btn-primary'}" onclick="advanceOrder(${order.id}, '${order.status}')">${actionLabel[order.status]}</button>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    async function advanceOrder(id, status) {
      const next = nextStatus[status];
      if (!next) return;
      try {
        await apiFetch(`/orders/${id}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status: next })
        });
        await loadOrders();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function init() {
      await loadOrders();
      setInterval(loadOrders, 10000);
    }

    init();
  </script>
</body>
</html>
